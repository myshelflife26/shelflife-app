<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="#3b82f6"/>

  <!-- Package/Box icon -->
  <g transform="translate(8, 8)">
    <!-- Box -->
    <rect x="2" y="6" width="12" height="10" fill="#ffffff" opacity="0.9"/>

    <!-- Box top flap -->
    <path d="M 2 6 L 8 3 L 14 6" fill="#ffffff"/>

    <!-- Box center line -->
    <line x1="8" y1="3" x2="8" y2="16" stroke="#3b82f6" stroke-width="1.5"/>

    <!-- Sparkle/star accent -->
    <circle cx="13" cy="4" r="1.5" fill="#a855f7"/>
  </g>
</svg>
